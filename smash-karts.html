
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smash Karts | Mango</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #172339;
    }
    h1 { font-size: 22px; margin: 0; }
    button, a {
      background: #ffc83d;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      color: #161616;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .game {
      width: 100%;
      height: calc(100dvh - 65px);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">🏠 Mango</a>
    <h1>🏎️ Smash Karts</h1>
    <button onclick="document.getElementById('kart').requestFullscreen()">
      ⛶ Fullscreen
    </button>
  </header>

  <main class="game">
    <iframe
      id="kart"
      src="https://smashkarts.io/"
      title="Smash Karts"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
