<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mango Arcade Six</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f6f7fc;font:16px system-ui,Arial}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#19253a}a{color:#ffcc61}header a{margin-right:auto}button,select{border:0;border-radius:9px;padding:11px 14px;background:#34445f;color:white;cursor:pointer;font:inherit}button:hover{background:#4b5d7d}main{max-width:1020px;margin:auto;padding:12px}#hud{min-height:24px;margin:8px 0 12px;color:#ffc857}canvas{width:100%;height:auto;aspect-ratio:900/520;display:block;border:2px solid #3d5572;border-radius:14px;touch-action:none;background:#15283c}#tips{color:#b9c8dc;font-size:14px;line-height:1.5}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0}.touch{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.touch button{min-width:70px;touch-action:none;user-select:none}@media(min-width:850px){.touch{opacity:.7}}
</style></head><body><header><a href="index.html">🥭 Back to Mango</a><strong>🎮 Mango Arcade Six</strong><select id="choose" aria-label="Choose game"><option value="hill">🚙 Hill Climb</option><option value="basket">🏀 Basket Bounce</option><option value="rope">🪢 Rope Swing</option><option value="archery">🏹 Ragdoll Archery</option><option value="soccer">⚽ Soccer Physics</option><option value="road">🐸 Road Hopper</option></select><button id="restart">↻ Restart</button><button id="full">⛶ Fullscreen</button></header><main><div id="hud" role="status"></div><canvas id="game" width="900" height="520" aria-label="Playable Mango arcade game"></canvas><p id="tips"></p><div class="touch"><div class="bar"><button data-key="arrowleft">◀ Left</button><button data-key="arrowright">Right ▶</button><button data-key="arrowup">▲ Up</button><button data-key="arrowdown">▼ Down</button></div><div class="bar"><button data-key="space">Jump / Action</button><button id="alt">Shoot / Release</button></div></div></main><script>
(()=>{'use strict';const cv=document.getElementById('game'),c=cv.getContext('2d'),W=900,H=520,$=id=>document.getElementById(id);let game,active,stamp=0,keys=new Set(),pointer={x:450,y:250,down:false},state;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),circ=(x,y,r,color)=>{c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()},rect=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)},line=(x,y,X,Y,color,width=3)=>{c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()},text=(s,x,y,size=22,color='#fff')=>{c.fillStyle=color;c.font=`bold ${size}px system-ui`;c.fillText(s,x,y)},dist=(a,b,x,y)=>Math.hypot(a-x,b-y),down=(...x)=>x.some(k=>keys.has(k));
const games={
 hill:{name:'Hill Climb-style Racing',tips:'Hold → or D to accelerate, ← or A to brake/reverse. Keep the car upright, collect coins, reach the finish.',init(){return{x:40,v:0,tilt:0,coins:new Set(),dead:false,won:false,score:0}},step(s,dt){if(s.dead||s.won)return;let g=t=>372-54*Math.sin(t/110)-23*Math.sin(t/41);s.v+=(down('arrowright','d')?.42:down('arrowleft','a')?-.48:-s.v*.035)*dt;s.v=clamp(s.v,-5,10);s.x=clamp(s.x+s.v*dt,25,3100);s.tilt+=(Math.atan2(g(s.x+26)-g(s.x-26),52)-s.tilt)*.09*dt; if(down('space'))s.tilt+=.023*dt;if(Math.abs(s.tilt)>1.4){s.dead=true}for(let i=1;i<29;i++)if(Math.abs(s.x-i*105)<18&&!s.coins.has(i)){s.coins.add(i);s.score+=10}if(s.x>3050)s.won=true},draw(s){let g=t=>372-54*Math.sin(t/110)-23*Math.sin(t/41),off=clamp(s.x-250,0,2400);rect(0,0,W,H,'#73bfea');circ(720,85,43,'#ffdd77');for(let i=0;i<14;i++){let x=i*220-off*.22;rect(x,310,140,100,'#8dadb1')}c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=8)c.lineTo(x,g(x+off));c.lineTo(W,H);c.fillStyle='#4d954b';c.fill();for(let i=1;i<29;i++){let x=i*105-off;if(x>0&&x<W&&!s.coins.has(i))circ(x,g(i*105)-32,12,'#ffcd42')}let x=s.x-off,y=g(s.x)-21;c.save();c.translate(x,y);c.rotate(s.tilt);rect(-28,-18,56,23,'#fb655e');rect(-12,-29,22,15,'#aad9fd');circ(-19,8,11,'#18223a');circ(19,8,11,'#18223a');c.restore();text(`Distance ${Math.floor(s.x)} / 3100   Coins ${s.score}`,22,35);if(s.dead||s.won)text(s.won?'🏆 Finish!':'Crashed! Press Restart',260,150,28)}} ,
 basket:{name:'Basketball Random-style',tips:'Two players on one keyboard: Player 1 A/D + W to jump/shoot, Player 2 ←/→ + ↑. First to 5 scores wins.',init(){return{p:[{x:170,y:428,v:0,score:0,color:'#f9745a',cool:0},{x:730,y:428,v:0,score:0,color:'#61c9ff',cool:0}],ball:{x:450,y:270,vx:1,vy:0,owner:-1},winner:-1}},step(s,dt){if(s.winner>=0)return;const bs=s.ball,players=s.p;players.forEach((p,i)=>{let L=i===0?'a':'arrowleft',R=i===0?'d':'arrowright',J=i===0?'w':'arrowup';p.x=clamp(p.x+(down(L)?-4.1:0)*dt+(down(R)?4.1:0)*dt,35,865);p.cool=Math.max(0,p.cool-dt);if(down(J)&&p.cool===0){p.v=-12;p.cool=25;if(bs.owner===i){bs.owner=-1;bs.vx=(i===0?1:-1)*rnd(8,12);bs.vy=-rnd(12,15)}}p.y+=p.v*dt;p.v+=.56*dt;if(p.y>430){p.y=430;p.v=0}if(bs.owner===i){bs.x=p.x+(i===0?22:-22);bs.y=p.y-50}});if(bs.owner===-1){bs.x+=bs.vx*dt;bs.y+=bs.vy*dt;bs.vy+=.42*dt;bs.vx*=.999;if(bs.y>477){bs.y=477;bs.vy*=-.65}if(bs.x<14||bs.x>886){bs.x=clamp(bs.x,14,886);bs.vx*=-.8}players.forEach((p,i)=>{if(dist(bs.x,bs.y,p.x,p.y-25)<39&&Math.abs(bs.vy)<14){bs.owner=i}})}for(let i=0;i<2;i++){const hoop=i===0?70:830;if(Math.abs(bs.x-hoop)<18&&bs.y>128&&bs.y<157&&bs.vy>0&&bs.owner===-1){const scorer=1-i;players[scorer].score++;bs.x=450;bs.y=230;bs.vx=0;bs.vy=0;if(players[scorer].score>=5)s.winner=scorer;break}}},draw(s){rect(0,0,W,H,'#9bdcf1');rect(0,480,W,40,'#dc9b5c');line(450,480,450,330,'#fff',3);[70,830].forEach((x,i)=>{rect(i?845:42,90,12,90,'#4c5d7f');line(x-24,138,x+24,138,'#e9633e',7);line(x-21,142,x-12,165,'#ddd',2);line(x+21,142,x+12,165,'#ddd',2)});s.p.forEach((p,i)=>{circ(p.x,p.y-29,24,p.color);line(p.x,p.y-7,p.x,p.y+25,p.color,12);line(p.x,p.y+17,p.x-16,p.y+38,'#28344c',6);line(p.x,p.y+17,p.x+16,p.y+38,'#28344c',6);text(i?'P2':'P1',p.x-12,p.y-24,13,'#10233a')});circ(s.ball.x,s.ball.y,15,'#f58d40');text(`${s.p[0].score}  :  ${s.p[1].score}`,402,40,32,'#172746');if(s.winner>=0)text(`Player ${s.winner+1} wins!`,320,240,34)}} ,
 rope:{name:'Rope Swing',tips:'Click/tap near a glowing anchor to attach the rope. Hold and swing with ←/→, release mouse or Space to launch. Reach the golden finish.',init(){return{x:80,y:350,vx:0,vy:0,anchor:0,len:Math.hypot(80-160,350-110),won:false,dead:false,anchors:[{x:160,y:110},{x:355,y:115},{x:565,y:100},{x:745,y:140}]}},step(s,dt){if(s.won||s.dead)return;let a=s.anchors[s.anchor];if(a){s.vx+=(down('arrowright','d')?.37:0)-(down('arrowleft','a')?.37:0);s.vy+=.32*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;let dx=s.x-a.x,dy=s.y-a.y,d=Math.hypot(dx,dy)||1;if(d>s.len){let nx=dx/d,ny=dy/d;s.x=a.x+nx*s.len;s.y=a.y+ny*s.len;let dot=s.vx*nx+s.vy*ny;if(dot>0){s.vx-=dot*nx;s.vy-=dot*ny}}}else{s.vy+=.42*dt;s.vx+=(down('arrowright','d')?.13:down('arrowleft','a')?-.13:0)*dt;s.x+=s.vx*dt;s.y+=s.vy*dt}if(s.y>490||s.x<0)s.dead=true;if(s.x>835&&s.y>250&&s.y<470)s.won=true},draw(s){rect(0,0,W,H,'#152541');for(let x=0;x<W;x+=80)line(x,0,x,H,'#223656',1);rect(840,260,60,200,'#356e55');text('FINISH',811,250,18,'#ffdc58');s.anchors.forEach((a,i)=>{circ(a.x,a.y,13,'#ffd160');circ(a.x,a.y,5,'#fff0b5')});if(s.anchor>=0){let a=s.anchors[s.anchor];line(a.x,a.y,s.x,s.y,'#dae5fd',4)}circ(s.x,s.y,20,'#5ce3be');circ(s.x+6,s.y-4,4,'#19223c');text('SWING →',360,47,22,'#e0eaff');if(s.dead||s.won)text(s.won?'You made it!':'Fell! Restart',345,225,35)}} ,
 archery:{name:'Ragdoll Archery',tips:'Move the mouse or touch to aim. Click / Space to shoot arrows at moving ragdoll targets. Hit 8 targets to win.',init(){return{shots:0,hits:0,arrows:[],targets:Array.from({length:4},(_,i)=>({x:460+i*110,y:175+i%2*130,v:i%2?1.2:-1.4,alive:true})),tick:0}},step(s,dt){s.tick+=dt;for(const a of s.arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=.16*dt;for(const t of s.targets)if(t.alive&&dist(a.x,a.y,t.x,t.y)<29){t.alive=false;a.dead=true;s.hits++}}s.arrows=s.arrows.filter(a=>!a.dead&&a.x<950&&a.y<520);for(let i=0;i<s.targets.length;i++){let t=s.targets[i];if(!t.alive){t.x=530+i*100;t.y=rnd(130,365);t.alive=true}t.y+=t.v*dt;if(t.y>420||t.y<110)t.v*=-1}},draw(s){rect(0,0,W,H,'#1e334d');rect(0,460,W,60,'#55744a');let angle=Math.atan2(pointer.y-354,pointer.x-80);line(80,354,80+Math.cos(angle)*58,354+Math.sin(angle)*58,'#f8d89a',8);circ(80,354,22,'#ff9d73');s.targets.forEach(t=>{line(t.x,t.y+10,t.x,t.y+40,'#a3dded',7);line(t.x,t.y+20,t.x-15,t.y+29,'#b8eaff',5);line(t.x,t.y+20,t.x+15,t.y+29,'#b8eaff',5);circ(t.x,t.y-6,20,'#f7ab78')});s.arrows.forEach(a=>{line(a.x-15,a.y-3,a.x+9,a.y+3,'#ffdd76',4)});text(`Hits ${s.hits}/8    Arrows fired ${s.shots}`,25,40);if(s.hits>=8)text('Archery champion!',290,100,28)}} ,
 soccer:{name:'Soccer Physics-style',tips:'Player 1 A/D to move, W to jump. Player 2 ←/→ to move, ↑ to jump. First to 5 goals wins.',init(){return{p:[{x:260,y:430,vy:0},{x:640,y:430,vy:0}],ball:{x:450,y:300,vx:0,vy:0},score:[0,0],winner:-1}},step(s,dt){if(s.winner>=0)return;s.p.forEach((p,i)=>{const l=i?'arrowleft':'a',r=i?'arrowright':'d',j=i?'arrowup':'w';p.x=clamp(p.x+(down(l)?-4.5:0)*dt+(down(r)?4.5:0)*dt,22,878);if(down(j)&&p.y>=430)p.vy=-11;p.vy+=.52*dt;p.y=clamp(p.y+p.vy*dt,10,430);if(p.y===430)p.vy=0;let b=s.ball,d=dist(b.x,b.y,p.x,p.y-25);if(d<47){const nx=(b.x-p.x)/(d||1),ny=(b.y-(p.y-25))/(d||1);b.vx+=nx*2.7;b.vy+=ny*2.7-1;b.x=p.x+nx*47;b.y=p.y-25+ny*47}});let b=s.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=.35*dt;b.vx*=.995;if(b.y>460){b.y=460;b.vy*=-.72}if(b.y<12){b.y=12;b.vy*=-.8}if(b.x<20||b.x>880){if(b.y>330){let winner=b.x<20?1:0;s.score[winner]++;if(s.score[winner]>=5)s.winner=winner;Object.assign(b,{x:450,y:300,vx:0,vy:0});s.p[0].x=260;s.p[1].x=640}else{b.x=clamp(b.x,20,880);b.vx*=-.8}}},draw(s){rect(0,0,W,H,'#91cfef');rect(0,476,W,44,'#4d995c');rect(0,330,20,146,'#eaf1f5');rect(880,330,20,146,'#eaf1f5');rect(0,330,95,8,'#fff');rect(805,330,95,8,'#fff');line(450,250,450,476,'#eaf5e6',3);s.p.forEach((p,i)=>{circ(p.x,p.y-29,23,i?'#6cb7fa':'#ef7869');line(p.x,p.y-5,p.x,p.y+24,'#344461',10);line(p.x,p.y+20,p.x-20,p.y+38,'#344461',7);line(p.x,p.y+20,p.x+20,p.y+38,'#344461',7)});circ(s.ball.x,s.ball.y,17,'#fafafa');text(`${s.score[0]}  :  ${s.score[1]}`,402,46,36,'#12263e');if(s.winner>=0)text(`Player ${s.winner+1} wins!`,317,208,34)}} ,
 road:{name:'Road Hopper',tips:'Use arrow keys / WASD or the touch controls to cross roads, avoid cars, and reach the far side. Each crossing earns a point.',init(){return{x:450,row:8,score:0,dead:false,step:0,cars:Array.from({length:7},(_,r)=>Array.from({length:3},(_,i)=>({x:i*365+r*70,v:(r%2?1:-1)*(2+r*.3)}))).flatMap((list,r)=>list.map(car=>({...car,row:r+1}))) }},step(s,dt){s.step=Math.max(0,s.step-dt);for(const car of s.cars){car.x+=car.v*dt;if(car.x<-110)car.x=1000;if(car.x>1000)car.x=-110;if(s.row===car.row&&Math.abs(s.x-car.x)<47)s.dead=true}if(s.row===0){s.score++;s.row=8;s.x=450}},draw(s){rect(0,0,W,H,'#4ca762');for(let r=1;r<8;r++){let y=r*54+20;rect(0,y,W,54,'#303c4c');for(let x=0;x<W;x+=95)rect(x,y+25,45,3,'#eddf9e')}s.cars.forEach(car=>{rect(car.x-38,car.row*54+28,76,32,car.row%2?'#ff8879':'#63bef1');rect(car.x-20,car.row*54+22,38,11,'#9fdcf0')});circ(s.x,s.row*54+44,19,'#fcde64');circ(s.x-5,s.row*54+39,3,'#243a35');circ(s.x+6,s.row*54+39,3,'#243a35');text(`Crossings: ${s.score}`,22,32,27,'#fff');text('SAFE ZONE',700,31,19,'#fff');if(s.dead)text('Hit by traffic! Restart',245,250,32,'#fff')}}
};
function reset(){game=games[active];state=game.init();$('hud').textContent=game.name; $('tips').textContent=game.tips;stamp=0}function change(){active=$('choose').value;history.replaceState(null,'',location.pathname+'?game='+active);reset()}function shoot(){if(active==='archery'){let dx=pointer.x-80,dy=pointer.y-354,m=Math.hypot(dx,dy)||1;state.arrows.push({x:90,y:352,vx:dx/m*18,vy:dy/m*18});state.shots++}else if(active==='rope'){state.anchor=-1}else{keys.add('space');setTimeout(()=>keys.delete('space'),170)}}function moveRoad(k){if(active!=='road'||state.dead||state.step>0)return;state.step=6;if(k==='arrowup'||k==='w')state.row=clamp(state.row-1,0,8);if(k==='arrowdown'||k==='s')state.row=clamp(state.row+1,0,8);if(k==='arrowleft'||k==='a')state.x=clamp(state.x-54,30,870);if(k==='arrowright'||k==='d')state.x=clamp(state.x+54,30,870)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k===' ')k='space';if(!keys.has(k)){moveRoad(k);if(active==='archery'&&k==='space')shoot();if(active==='rope'&&k==='space')state.anchor=-1}keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()===' '?'space':e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());function xy(e){let r=cv.getBoundingClientRect();pointer.x=(e.clientX-r.left)*W/r.width;pointer.y=(e.clientY-r.top)*H/r.height}cv.addEventListener('pointermove',xy);cv.addEventListener('pointerdown',e=>{xy(e);pointer.down=true;if(active==='rope'){let idx=state.anchors.findIndex(a=>dist(pointer.x,pointer.y,a.x,a.y)<85);if(idx>=0){state.anchor=idx;let a=state.anchors[idx];state.len=clamp(dist(state.x,state.y,a.x,a.y),90,300)}}else if(active==='archery')shoot()});window.addEventListener('pointerup',()=>{pointer.down=false;if(active==='rope')state.anchor=-1});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);moveRoad(k)});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys.delete(k))});$('alt').onclick=shoot;$('choose').onchange=change;$('restart').onclick=reset;$('full').onclick=()=>cv.requestFullscreen?.();const param=new URLSearchParams(location.search).get('game');$('choose').value=games[param]?param:'hill';active=$('choose').value;reset();function loop(t){let dt=stamp?clamp((t-stamp)/16.67,.1,2.5):1;stamp=t;game.step(state,dt);game.draw(state);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
